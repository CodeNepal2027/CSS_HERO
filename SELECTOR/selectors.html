<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <title>CSS HERO || Selectors Practice Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #0f172a; margin-bottom: 25px; font-size: 1.8rem; text-align: center; }
        .button-container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 320px; }
        .btn {
            display: block;
            text-decoration: none;
            text-align: center;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: all 0.2s ease-in-out;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 15px -3px rgba(0,0,0,0.15); filter: brightness(1.08); }
        .btn:active { transform: translateY(0); }

        .btn-basic  { background-color: #3b82f6; }
        .btn-combo  { background-color: #10b981; }
        .btn-attr   { background-color: #8b5cf6; }
        .btn-pseudo { background-color: #f59e0b; }
    </style>
</head>
<body>

    <h1>CSS Selectors Practice Modules</h1>

    <div class="button-container">
        <a href="./components/basic_selectors.html"      rel="noopener noreferrer" class="btn btn-basic">Basic Selectors</a>
        <a href="./components/combinator_selectors.html" rel="noopener noreferrer" class="btn btn-combo">Combinator Selectors</a>
        <a href="./components/attribute_selectors.html"  rel="noopener noreferrer" class="btn btn-attr">Attribute Selectors</a>
        <a href="./components/pseudo_selectors.html"     rel="noopener noreferrer" class="btn btn-pseudo">Pseudo Selectors</a>
    </div>

</body>
</html>
